name: pulsecraft
description: PulseCraft AI — strength biomechanics assistant
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  vibration: ^2.0.0
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
