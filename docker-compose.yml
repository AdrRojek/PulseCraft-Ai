services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -l info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api
